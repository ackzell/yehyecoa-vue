  <script>
    (function () {
      "use strict";
      var $ = function (s) { return document.getElementById("f03-console-dock-" + s); };
      var W = 1920, H = 1080;
      var SLOT_INNER_W = 1073.2;
      var FIT = SLOT_INNER_W / W;
      var world = $("world"), fit = $("fit"), cursor = $("cursor"), ring = $("ring");
      var btn = $("btn"), dbl = $("dbl"), docked = $("docked"), panel = $("panel"), kicker = $("kicker");
      var overFit = $("over-fit"), pointer = $("pointer"), handle = $("handle"), dropRing = $("dropring");
      var masks = [$("mask1"), $("mask2"), $("mask3")];
      var glows = [$("glow1"), $("glow2"), $("glow3")];
      fit.style.transform = "scale(" + FIT.toFixed(5) + ")";
      overFit.style.transform = "scale(" + FIT.toFixed(5) + ")";

      // Clicks measured on console-log-output.mp4 (button label flips at ~1.75 / 2.65 / 3.65s).
      var CLICKS = [1.75, 2.65, 3.65];
      var BUTTON = [{ x: 1452, y: 326 }, { x: 1446, y: 322 }, { x: 1456, y: 328 }];
      var START = { x: 1990, y: 1010 };
      // Dock drag, measured on console-dock-drag.mp4 (pointer path from console-dock-drag.json,
      // re-anchored on the clip's visible drop; frame time = clip time + 4.31s):
      //   grab the console header at G, press 5.9, glide to the editor's right zone R (6.10-7.07),
      //   then to its bottom zone B (7.65-8.62), release 9.47 (console docks under the editor).
      var G = { x: 1261, y: 564 }, R = { x: 840, y: 470 }, B = { x: 520, y: 900 }, EXIT = { x: 1760, y: 1120 };
      var PRESS = 5.9, G1 = [6.10, 7.07], G2 = [7.65, 8.62], DROP = 9.47, EXIT_AT = [9.75, 10.35];
      var END = G;
      // Camera target: button at top, console rows below, rows' left edge in frame.
      var ZOOM = 2.0, TX = 1270, TY = 490;
      var PUSH_AT = 1.0, PUSH_END = 1.65, PULL_AT = 4.55, PULL_END = 5.0;

      var e3io = gsap.parseEase("power3.inOut"), e2io = gsap.parseEase("power2.inOut");
      var arrive = gsap.parseEase("power3.out"), eIn = gsap.parseEase("power2.in"), eOut = gsap.parseEase("power2.out");
      function c01(u) { return u < 0 ? 0 : u > 1 ? 1 : u; }
      function mix(a, b, u) { return a + (b - a) * u; }
      function arc(p0, p1, u, bend) {
        var cx = (p0.x + p1.x) / 2 - (p1.y - p0.y) * bend, cy = (p0.y + p1.y) / 2 + (p1.x - p0.x) * bend, w = 1 - u;
        return { x: w * w * p0.x + 2 * w * u * cx + u * u * p1.x, y: w * w * p0.y + 2 * w * u * cy + u * u * p1.y };
      }
      function camU(t) {
        if (t < PUSH_AT) return 0;
        if (t < PUSH_END) return e3io((t - PUSH_AT) / (PUSH_END - PUSH_AT));
        if (t < PULL_AT) return 1;
        if (t < PULL_END) return 1 - e2io((t - PULL_AT) / (PULL_END - PULL_AT));
        return 0;
      }
      function cursorAt(t) {
        if (t < PUSH_AT) return START;
        if (t < 1.6) return arc(START, BUTTON[0], arrive(c01((t - PUSH_AT) / 0.6)), 0.12);
        if (t < 2.0) return BUTTON[0];
        if (t < 2.5) return arc(BUTTON[0], BUTTON[1], arrive(c01((t - 2.0) / 0.5)), 0.2);
        if (t < 3.0) return BUTTON[1];
        if (t < 3.5) return arc(BUTTON[1], BUTTON[2], arrive(c01((t - 3.0) / 0.5)), 0.2);
        if (t < PULL_AT) return BUTTON[2];
        return arc(BUTTON[2], END, e2io(c01((t - PULL_AT) / (PULL_END - PULL_AT))), -0.1);
      }
      function quadIO(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
      function lerpP(a, b, u) { return { x: mix(a.x, b.x, u), y: mix(a.y, b.y, u) }; }
      function pointerAt(t) {
        if (t < G1[0]) return G;
        if (t < G1[1]) return lerpP(G, R, quadIO((t - G1[0]) / (G1[1] - G1[0])));
        if (t < G2[0]) return R;
        if (t < G2[1]) return lerpP(R, B, quadIO((t - G2[0]) / (G2[1] - G2[0])));
        if (t < EXIT_AT[0]) return B;
        return arc(B, EXIT, eIn(c01((t - EXIT_AT[0]) / (EXIT_AT[1] - EXIT_AT[0]))), 0.08);
      }
      function pressAt(since) {
        if (since < 0 || since >= 0.28) return 0;
        return since < 0.08 ? since / 0.08 : 1 - eOut((since - 0.08) / 0.2);
      }

      function render(t) {
        var u = camU(t), z = mix(1, ZOOM, u);
        var cx = mix(W / 2, TX, u), cy = mix(H / 2, TY, u);
        var hw = W / (2 * z), hh = H / (2 * z);
        cx = Math.max(hw, Math.min(W - hw, cx));
        cy = Math.max(hh, Math.min(H - hh, cy));
        world.style.transform = "translate(" + (W / 2 - cx * z).toFixed(2) + "px," + (H / 2 - cy * z).toFixed(2) + "px) scale(" + z.toFixed(4) + ")";

        var n = 0, last = -1;
        for (var i = 0; i < CLICKS.length; i++) if (t >= CLICKS[i]) { n = i + 1; last = i; }
        var since = last >= 0 ? t - CLICKS[last] : 99;

        var p = cursorAt(t);
        cursor.style.opacity = t >= PUSH_AT && t < PULL_END ? "1" : "0";
        cursor.style.transform = "translate(" + (p.x - 13.33).toFixed(2) + "px," + (p.y - 8).toFixed(2) + "px) scale(" + (1 - 0.15 * pressAt(since)).toFixed(3) + ")";

        var rr = since / 0.35;
        ring.style.opacity = rr < 1 ? (1 - rr).toFixed(3) : "0";
        if (rr < 1) {
          var r = 12 + 32 * eOut(rr), hp = BUTTON[last];
          ring.style.width = ring.style.height = (2 * r).toFixed(2) + "px";
          ring.style.transform = "translate(" + (hp.x - r).toFixed(2) + "px," + (hp.y - r).toFixed(2) + "px)";
        }

        // App state rebuilt on the measured still: counter digits + rows land per click.
        btn.textContent = String(n);
        dbl.textContent = String(n * 2);
        btn.style.opacity = dbl.style.opacity = n < 3 ? "1" : "0";
        for (var k = 0; k < 3; k++) {
          var land = c01((t - CLICKS[k] - 0.06) / 0.1);
          masks[k].style.opacity = (1 - land).toFixed(3);
          var g = t - CLICKS[k] - 0.08;
          glows[k].style.opacity = g < 0 ? "0" : g < 0.12 ? (g / 0.12).toFixed(3) : (1 - c01((g - 0.12) / 0.5)).toFixed(3);
        }
        // Tight read 3.9–4.6: crisp panel plate at identical geometry.
        panel.style.opacity = t >= 3.9 && t < 4.6 ? "1" : "0";
        // The dock clip opens on this same still state (3 logs, default layout), so the hand-off at
        // 5.0 is invisible; after the clip is cut at the drop the docked plate holds the result.
        docked.style.opacity = t >= DROP ? "1" : "0";

        // Over-layer pointer: takes over from the world cursor at 5.0 (camera is wide by then).
        var q = pointerAt(t);
        var held = t >= PRESS && t < DROP;
        var pressIn = held ? 1 - 0.15 * eOut(c01((t - PRESS) / 0.12)) : 1 - 0.15 * (1 - eOut(c01((t - DROP) / 0.2)));
        pointer.style.opacity = t >= PULL_END && t < EXIT_AT[1] ? "1" : "0";
        pointer.style.transform = "translate(" + (q.x - 13.33).toFixed(2) + "px," + (q.y - 8).toFixed(2) + "px) scale(" + (t >= PRESS ? pressIn : 1).toFixed(3) + ")";
        var dr = (t - DROP) / 0.45;
        dropRing.style.opacity = dr >= 0 && dr < 1 ? (1 - dr).toFixed(3) : "0";
        if (dr >= 0 && dr < 1) {
          var rad = 16 + 44 * eOut(dr);
          dropRing.style.width = dropRing.style.height = (2 * rad).toFixed(2) + "px";
          dropRing.style.transform = "translate(" + (B.x - rad).toFixed(2) + "px," + (B.y - rad).toFixed(2) + "px)";
        }
      }

      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };
      tl.to(clock, { t: 11.4, duration: 11.4, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      // Scene 1: surface slides in from the left edge on a long-tail settle.
      tl.fromTo($("slot"), { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "power4.out" }, 0);
      // Kicker types on (smooth slice).
      var KICK = "Built in", kl = { v: 0 };
      tl.fromTo(kl, { v: 0 }, { v: KICK.length, duration: 0.55, ease: "none", onUpdate: function () {
        kicker.textContent = KICK.substring(0, Math.floor(kl.v + 0.0001));
      } }, 0.25);

      // Scene 3: headline assembles on the click beats.
      var heads = [$("h1"), $("h2"), $("h3")];
      heads.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: true }, CLICKS[i] + 0.04);
      });

      // Scene 6: subline word by word; one magenta glow outlines the console header (the drag handle) before the grab.
      var subs = document.querySelectorAll('#f03-console-dock-ground .f3-s');
      for (var s = 0; s < subs.length; s++) {
        tl.fromTo(subs[s], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: true }, 5.2 + s * 0.12);
      }
      tl.fromTo(handle, { opacity: 0, boxShadow: "0 0 0px 0px rgba(228,0,124,0)" },
        { opacity: 1, boxShadow: "0 0 22px 6px rgba(228,0,124,0.85)", duration: 0.25, ease: "power2.out", immediateRender: true }, 5.3);
      tl.to(handle, { opacity: 0, boxShadow: "0 0 0px 0px rgba(228,0,124,0)", duration: 0.35, ease: "power2.in" }, 6.0);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["03-console-dock"] = tl;
    })();
  </script>
