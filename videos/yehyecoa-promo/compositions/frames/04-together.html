  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // ---- geometry (canvas px) — hoisted clips are placed at exactly these rects ----
      const CX = 960, CY = 540;
      const GEOM = {
        inst:  { x: 106,  y: 308, w: 960, h: 540 },
        dark:  { x: 1296, y: 308, w: 518, h: 292 },
        light: { x: 1296, y: 662, w: 518, h: 292 },
      };
      // Hoisted clips live at the host root after assembly; missing in isolated preview.
      // The frame-scoped `document` cannot see host-root elements; the hoisted clips need window.document.
      const hostEl = (id) => window.document.getElementById(id);
      const VID = { inst: hostEl("f04-together-vid-inst"), dark: hostEl("f04-together-vid-dark"), light: hostEl("f04-together-vid-light") };
      const WIN = { inst: $("f04-together-win-inst"), dark: $("f04-together-win-dark"), light: $("f04-together-win-light") };
      const TAG = { inst: $("f04-together-tag-inst"), dark: $("f04-together-tag-dark"), light: $("f04-together-tag-light") };
      const cam = $("f04-together-cam");
      const badge = $("f04-together-badge");

      // ---- camera (coordinate-target-zoom) ----
      // World point (tx,ty) lands at canvas centre at scale S. The in-frame layer is one
      // full-canvas wrapper (origin = centre): x = -S*off. Each hoisted clip scales around
      // its own centre, so its translate is S*(d - off) - d, d = clip centre - canvas centre.
      // Both are affine in S, so shared duration + ease keeps every layer locked together.
      const camState = (S, tx, ty) => ({ scale: S, x: -S * (tx - CX), y: -S * (ty - CY) });
      const vidState = (g, S, tx, ty) => {
        const dx = g.x + g.w / 2 - CX, dy = g.y + g.h / 2 - CY;
        return { scale: S, x: S * (dx - (tx - CX)) - dx, y: S * (dy - (ty - CY)) - dy };
      };
      const WIDE = [1, CX, CY];
      function camMove(from, to, at, dur, ease) {
        tl.fromTo(cam, camState(...from), { ...camState(...to), duration: dur, ease, immediateRender: false }, at);
        for (const k of Object.keys(VID)) {
          if (!VID[k]) continue;
          tl.fromTo(VID[k], vidState(GEOM[k], ...from), { ...vidState(GEOM[k], ...to), duration: dur, ease, immediateRender: false }, at);
        }
      }
      const SHARP = "blur(0px) brightness(1)";
      const SOFT = "blur(6px) brightness(0.45)";
      function rack(keys, from, to, at, dur, ease) {
        for (const k of keys) {
          if (VID[k]) tl.fromTo(VID[k], { filter: from }, { filter: to, duration: dur, ease, immediateRender: false }, at);
        }
      }
      function dimChrome(els, from, to, at, dur, ease) {
        tl.fromTo(els, { opacity: from }, { opacity: to, duration: dur, ease, immediateRender: false }, at);
      }

      // Clip timing (clips mount at 0.8s; frame t = clip t + 0.8, confirmed via frame grabs):
      // "Class of 2026" lands ~6.3s, "* 10" ~7.8s; light paints increment() pink ~9.8–13.8s;
      // light paints @media pink from ~16.05s, dark paints it amber from ~16.8s.

      // ---- Scene 1 (0.0–1.2): kicker, then "rehearse together." word by word ----
      tl.fromTo("#f04-together-kicker", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo(".f04-together-hw", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.22 }, 0.25);

      // ---- Scene 2 (0.8–2.2): instructor from the left wing, inward tilt, flat on a long-tail settle ----
      const ENTRY_INST = { x: -1300, rotationY: 22, scale: 0.85, transformPerspective: 1600 };
      const LANDED = { x: 0, rotationY: 0, scale: 1, transformPerspective: 1600 };
      tl.fromTo(WIN.inst, ENTRY_INST, { ...LANDED, duration: 1.3, ease: "expo.out" }, 0.8);
      if (VID.inst) tl.fromTo(VID.inst, ENTRY_INST, { ...LANDED, duration: 1.3, ease: "expo.out" }, 0.8);
      tl.fromTo(TAG.inst, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.35);
      tl.fromTo(".f04-together-fa", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.16 }, 1.8);
      tl.set("#f04-together-foot-b", { opacity: 0 }, 0);

      // ---- Scene 3 (2.2–3.6): students from the right wing, mirrored tilt (dark, then light +0.3s) ----
      const ENTRY_STU = { x: 760, rotationY: -22, scale: 0.85, transformPerspective: 1600 };
      [["dark", 2.2], ["light", 2.5]].forEach(([k, at]) => {
        tl.fromTo(WIN[k], ENTRY_STU, { ...LANDED, duration: 1.1, ease: "expo.out" }, at);
        if (VID[k]) tl.fromTo(VID[k], ENTRY_STU, { ...LANDED, duration: 1.1, ease: "expo.out" }, at);
        tl.fromTo(TAG[k], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, at + 0.45);
      });

      // ---- Scene 4 (3.8–4.6): "Following instructor" badge pops at the column's inner edge (the one overshoot) ----
      tl.fromTo(badge, { scale: 0, opacity: 0, transformOrigin: "100% 50%" },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2.4)" }, 3.8);
      tl.fromTo(badge, { filter: "drop-shadow(0px 0px 0px rgba(228,0,124,0))" },
        { filter: "drop-shadow(0px 0px 14px rgba(228,0,124,0.85))", duration: 0.3, ease: "power2.out", immediateRender: false }, 4.3);
      tl.to(badge, { filter: "drop-shadow(0px 0px 0px rgba(228,0,124,0))", duration: 0.5, ease: "power2.in" }, 4.6);

      // ---- Scene 5 (4.6–9.0): wide hold — the live edits are the motion ----

      // ---- Scene 6 (9.0–12.6): push in on the LIGHT student's editor, increment() painted pink ----
      // target = light clip point (420, 330) of 1920x1080 → canvas (1409.3, 751.0); S 3.5 (≤ source res)
      const P1 = [3.5, GEOM.light.x + 420 * (GEOM.light.w / 1920), GEOM.light.y + 330 * (GEOM.light.h / 1080)];
      camMove(WIDE, P1, 9.0, 1.4, "power3.inOut");
      rack(["inst", "dark"], SHARP, SOFT, 9.0, 1.0, "power2.out");
      dimChrome([WIN.inst, WIN.dark, TAG.inst, TAG.dark, badge], 1, 0.35, 9.0, 1.0, "power2.out");

      // ---- Scene 7 (12.6–13.7): decelerating pull back; focus racks back; foot line hard-cuts ----
      camMove(P1, WIDE, 12.6, 1.1, "power3.out");
      rack(["inst", "dark"], SOFT, SHARP, 12.6, 0.9, "power2.out");
      dimChrome([WIN.inst, WIN.dark, TAG.inst, TAG.dark, badge], 0.35, 1, 12.6, 0.9, "power2.out");
      tl.set("#f04-together-foot-a", { opacity: 0 }, 13.2);
      tl.set("#f04-together-foot-b", { opacity: 1 }, 13.2);

      // ---- Scene 8 (14.6–18.0): push in on the student column — amber (dark) + pink (light) @media ----
      const P2 = [1.38, 1555, 612];
      camMove(WIDE, P2, 14.6, 1.3, "power3.inOut");
      rack(["inst"], SHARP, SOFT, 14.6, 1.0, "power2.out");
      dimChrome([WIN.inst, TAG.inst], 1, 0.35, 14.6, 1.0, "power2.out");

      // ---- Scene 9 (18.0–18.9): decelerating pull back to the full room ----
      camMove(P2, WIDE, 18.0, 0.9, "power3.out");
      rack(["inst"], SOFT, SHARP, 18.0, 0.8, "power2.out");
      dimChrome([WIN.inst, TAG.inst], 0.35, 1, 18.0, 0.8, "power2.out");

      // ---- Scene 10 (18.9–20.0): held wide read; "in sync." flares once ----
      tl.fromTo("#f04-together-insync", { textShadow: "0px 0px 0px rgba(228,0,124,0)" },
        { textShadow: "0px 0px 28px rgba(228,0,124,0.9)", duration: 0.3, ease: "power2.out" }, 19.0);
      tl.to("#f04-together-insync", { textShadow: "0px 0px 0px rgba(228,0,124,0)", duration: 0.5, ease: "power2.in" }, 19.3);

      // pad the timeline to the full frame duration
      tl.set({}, {}, 20);

      window.__timelines["04-together"] = tl;
    })();
  </script>
