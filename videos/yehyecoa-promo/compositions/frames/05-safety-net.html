    <!-- Focal clip: hoisted to the host root by assemble-index (geometry = slot content rect).

  <script>
    (function () {
      var ID = "05-safety-net";
      var $ = function (id) { return document.getElementById("f05-safety-net-" + id); };

      // Slot: content rect on the 1920x1080 frame; the world is the app at native 1920x1080.
      var SX = 739.2, SY = 237.6, W = 1075.2, H = 604.8, K = W / 1920; // 0.56
      // Measured on the clip/screenshot (native px): toasts, drawer, diff popover, oldest Restore.
      var RESTORE = { x: 1655, y: 546 };

      var under = $("world-under"), over = $("world-over");
      var cursorEl = $("cursor"), ringEl = $("ring");
      var videoEl = null;

      // ONE camera state: zoom s, native focus point (cx, cy) shown at slot centre, blur px.
      var cam = { s: 1, cx: 960, cy: 540, blur: 0 };
      // Cursor offset from its (camera-tracked) target in screen px, plus click scale.
      var cur = { dx: 170, dy: 660, sc: 1 };

      function findVideo() {
        if (videoEl && videoEl.isConnected) return videoEl;
        videoEl = window.document.getElementById("f05-safety-net-clip"); // hoisted to the host root; the frame-scoped `document` cannot see it
        if (videoEl) { videoEl.style.zIndex = "2"; videoEl.style.transformOrigin = "0 0"; }
        return videoEl;
      }

      // Single writer: every leg, the hoisted clip, the over-layer and the cursor follow cam.
      function applyCamera() {
        var z = K * cam.s;
        var tx = W / 2 - z * cam.cx;
        var ty = H / 2 - z * cam.cy;
        var tf = "translate(" + tx + "px," + ty + "px) scale(" + z + ")";
        var f = cam.blur > 0.01 ? "blur(" + cam.blur + "px)" : "none";
        under.style.transform = tf;
        under.style.filter = f;
        over.style.transform = tf;
        var v = findVideo();
        if (v) {
          var s = cam.s;
          v.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
          var l = -tx / s, t = -ty / s, r = W - (W - tx) / s, b = H - (H - ty) / s;
          v.style.clipPath = "inset(" + t + "px " + r + "px " + b + "px " + l + "px)";
          v.style.filter = f;
        }
        var px = SX + tx + z * RESTORE.x;
        var py = SY + ty + z * RESTORE.y;
        cursorEl.style.transform =
          "translate(" + (px + cur.dx - 46.66) + "px," + (py + cur.dy - 28) + "px) scale(" + cur.sc + ")";
        ringEl.style.left = px + "px";
        ringEl.style.top = py + "px";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: applyCamera });
      function camTo(at, dur, ease, to) {
        tl.to(cam, Object.assign({ duration: dur, ease: ease, onUpdate: applyCamera }, to), at);
      }
      function rise(el, at, dur) {
        tl.fromTo(el, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: dur || 0.4, ease: "power3.out" }, at);
      }
      function glow(el, at) {
        tl.fromTo(el, { textShadow: "0 0 0px rgba(228,0,124,0)" },
          { textShadow: "0 0 28px rgba(228,0,124,0.9)", duration: 0.3, ease: "power2.out" }, at);
        tl.to(el, { textShadow: "0 0 0px rgba(228,0,124,0)", duration: 0.7, ease: "power2.inOut" }, at + 0.3);
      }

      // Initial states (seek-safe: fromTo / set at 0).
      tl.set(cam, { s: 1, cx: 960, cy: 540, blur: 0 }, 0);
      tl.set(cur, { dx: 170, dy: 660, sc: 1 }, 0);
      tl.set(cursorEl, { opacity: 0 }, 0);
      tl.set(ringEl, { opacity: 0, scale: 0.3 }, 0);
      tl.set($("still"), { opacity: 1 }, 0);
      tl.set([$("diff-plate"), $("drawer-plate"), $("marker")], { opacity: 0 }, 0);
      tl.set($("marker-path"), { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
      ["b1", "b2", "b3"].forEach(function (b) { tl.set($(b), { opacity: 0 }, 0); });

      // Retimed 20s -> 16s (2026-10 refresh): the toast dive is tightened and the clip is mounted
      // 1.0s deeper (in-point 1.35s), so every clip-locked beat lands 2.6s earlier than before.
      // Scene 1 (0.0-1.2): kicker, headline word by word, "saved." lands ~1.0; slot slides in.
      rise($("kicker"), 0.05, 0.35);
      rise($("h1"), 0.15); rise($("h2"), 0.32); rise($("h3"), 0.48); rise($("h4"), 0.7, 0.45);
      tl.fromTo([$("slot"), $("over-slot")], { x: 140, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.3);

      // Scene 2 (1.1-2.1): LEG 1 dive onto the two "Snapshot saved" toasts; "saved." flares.
      camTo(1.1, 1.0, "power4.out", { s: 3.2, cx: 960, cy: 104 });
      glow($("h4"), 1.8);
      // Scene 3 (2.1-3.0): hold tight, near-imperceptible drift.
      camTo(2.1, 0.9, "sine.inOut", { s: 3.3 });

      // Scene 4 (3.0-3.8): pull back; cut-the-curve to the clip at peak velocity (3.4),
      // blur envelope on the camera matched on both sides of the swap.
      camTo(3.0, 0.8, "power2.inOut", { s: 1, cx: 960, cy: 540 });
      tl.to(cam, { blur: 18, duration: 0.4, ease: "power2.in", onUpdate: applyCamera }, 3.0);
      tl.to(cam, { blur: 0, duration: 0.4, ease: "power2.out", onUpdate: applyCamera }, 3.4);
      tl.set($("still"), { opacity: 0 }, 3.4);

      // Scene 5 (3.8-4.6): wide on the clip, camera locked.
      // Scene 6 (4.6-6.3): LEG 2 travel right as the drawer slides in (clip 2.1-3.1 -> 4.15-5.15).
      camTo(4.6, 1.4, "power2.inOut", { s: 1.35, cx: 1209, cy: 420 });
      camTo(6.0, 1.7, "sine.inOut", { s: 1.38 });

      // Scene 7: LEG 3 dive onto the diff popover (opens clip 5.8-6.0 -> 7.85-8.05).
      camTo(7.7, 0.85, "power4.out", { s: 1.7, cx: 1355, cy: 664 });
      tl.fromTo($("diff-plate"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 8.4);
      tl.set($("b1"), { opacity: 1 }, 8.5);
      rise($("b1w1"), 8.5);
      tl.set($("marker"), { opacity: 1 }, 9.2);
      tl.to($("marker-path"), { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 9.2);
      camTo(8.55, 2.55, "sine.inOut", { s: 1.76, cx: 1372, cy: 650 });
      // Popover closes at clip 9.2-9.4 (11.25-11.45): crisp plate + marker clear just before.
      tl.to([$("diff-plate"), $("marker")], { opacity: 0, duration: 0.15, ease: "none" }, 11.0);

      // Scene 8 (11.25-13.0): swoop down the drawer to the oldest snapshot's Restore.
      camTo(11.25, 1.15, "power3.inOut", { s: 2.2, cx: 1484, cy: 546 });
      // Crisp drawer plate only until the app's own hover state begins (~clip 10.1 -> 12.15).
      tl.fromTo($("drawer-plate"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 11.35);
      tl.to($("drawer-plate"), { opacity: 0, duration: 0.15, ease: "none" }, 11.95);
      camTo(12.4, 0.6, "sine.inOut", { s: 2.25, cx: 1490 });
      tl.set($("b2"), { opacity: 1 }, 12.4);
      rise($("b2w1"), 12.4);
      // oversized-cursor: glide in, aim, click on the clip's own click (clip 10.9 -> 12.95).
      tl.set(cursorEl, { opacity: 1 }, 12.05);
      tl.to(cur, { dx: 0, dy: 0, duration: 0.55, ease: "power3.out", onUpdate: applyCamera }, 12.05);
      tl.to(cur, { sc: 0.9, duration: 0.1, ease: "power2.in", onUpdate: applyCamera }, 12.85);
      tl.to(cur, { sc: 1, duration: 0.22, ease: "power2.out", onUpdate: applyCamera }, 12.95);
      tl.set(ringEl, { opacity: 1, scale: 0.3 }, 12.95);
      tl.to(ringEl, { scale: 1.7, opacity: 0, duration: 0.55, ease: "power2.out" }, 12.95);

      // Scene 9 (13.05-14.0): consequence - decelerating pull back to wide as the code reverts
      // and the blue "auto" snapshot appears (clip 11.0-11.2); cursor settles below, exits.
      camTo(13.05, 0.95, "power4.out", { s: 1, cx: 960, cy: 540 });
      tl.to(cur, { dx: 48, dy: 40, duration: 0.4, ease: "power2.inOut", onUpdate: applyCamera }, 13.05);
      tl.to(cur, { dy: 720, duration: 0.4, ease: "power2.in", onUpdate: applyCamera }, 13.6);
      tl.set(cursorEl, { opacity: 0 }, 14.0);

      // Scene 10 (14.0-15.0): last bullet, "fearlessly" flares.
      tl.set($("b3"), { opacity: 1 }, 14.0);
      rise($("b3w1"), 14.0); rise($("b3w2"), 14.25);
      glow($("b3w2"), 14.55);

      // Scene 11 (15.0-16.0): held wide read; the root transition is the exit.
      tl.set({}, {}, 16);

      applyCamera();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
