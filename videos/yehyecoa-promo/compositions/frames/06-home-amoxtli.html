    (function () {

      const W = 1920, H = 1080;
      const tl = gsap.timeline({ paused: true });

      // Single-wrapper camera (viewport-change form): translate(T) scale(S), origin center.
      // A frame-space point p lands at center when T = -(p - center) * S.
      const S0 = 2.6;
      const camAt = (cx, cy) => ({ scale: S0, x: -(cx - W / 2) * S0, y: -(cy - H / 2) * S0 });

      const glideStart = camAt(1282, 560);
      const glideEnd = camAt(1236, 612); // slow drift down-left along the editor code

      // Scene 1 (0–2.6s): full-bleed close-up, gentle glide.
      tl.fromTo("#h06-world", glideStart, { ...glideEnd, duration: 2.6, ease: "sine.inOut" }, 0);
      // Scene 2 (2.6–3.8s): THE reveal — one heavily decelerating zoom-out, then the frame locks.
      tl.to("#h06-world", { scale: 1, x: 0, y: 0, duration: 1.2, ease: "expo.out" }, 2.6);

      // Scene 3 (4.0–5.4s): kicker types on, then the headline assembles word by word.

      const KICK = "ITS HOME";
      const k = { v: 0 };
      tl.fromTo(k, { v: 0 }, { v: KICK.length, duration: 0.55, ease: "none",
        onUpdate: () => { kickerEl.textContent = KICK.substring(0, Math.floor(k.v)); } }, 4.0);
      tl.fromTo(".h06-word", { y: 36, opacity: 0 },

        tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 5.8);
      });

      // Scene 5 (7.2–10s): deliberate still hold; pad the timeline to the full duration.
      tl.to({}, { duration: 0.01 }, 9.99);

      window.__timelines = window.__timelines || {};
