    <!-- Focal live clip: hoisted to the host root at identical slot geometry.
         Frame time = clip time + 7.0 (mounts 7.4s from in-point 0.4s). Duration runs to the

    <!-- approved frame video hoisted by assemble-index -->

  <script>
    (function () {
      const ID = "02-promise-focus";
      const $ = (s) => document.getElementById("f-" + ID + "-" + s);
      const tl = gsap.timeline({ paused: true });
      const DUR = 14;

      // ---- Scene 1 (0.0–1.2): kicker types on behind a magenta block caret (discrete-text-sequence).
      const KICKER = "A Vue playground";
      const SEQ = [{ t: 0, text: "" }];
      let kt = 0.15;
      for (let i = 1; i <= KICKER.length; i++) {
        kt += KICKER[i - 1] === " " ? 0.11 : (i % 3 === 0 ? 0.075 : 0.045);
        SEQ.push({ t: kt, text: KICKER.slice(0, i) });
      }
      const textAt = (time) => {
        for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
        return "";
      };
      const kickerEl = $("kicker-text");
      const caretEl = $("caret");
      let lastKicker = null;
      const typer = { t: 0 };
      tl.to(typer, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const s = textAt(typer.t);
          if (s !== lastKicker) { kickerEl.textContent = s; lastKicker = s; }
          // Caret: solid while typing, then a deterministic square-wave blink; retires at 2.6s.
          let on;
          if (typer.t < kt + 0.05) on = true;
          else if (typer.t < 2.6) on = Math.sin((typer.t - kt) * Math.PI * 2 / 0.7 + Math.PI / 2) > 0;
          else on = false;
          caretEl.style.opacity = on ? "1" : "0";
        },
      }, 0);

      // ---- Scene 2 (1.2–2.6): "minus the noise." word by word; "noise." lands last at ~2.3s.
      // Content-aware sequencing: each word's lead time scales with its length, anchored so the
      // final word settles at LAND.
      const WORDS = [$("w0"), $("w1"), $("w2")];
      const ENTER = 0.45, LAND = 2.3;
      const gaps = WORDS.map((w) => 0.2 + w.textContent.length * 0.04);
      let at = LAND - ENTER;
      const starts = [];
      for (let i = WORDS.length - 1; i >= 0; i--) { starts[i] = at; at -= gaps[i]; }
      WORDS.forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: ENTER, ease: "power3.out" }, starts[i]);
      });

      // ---- Scene 3 (2.6–3.8): product surface slides in from the right edge on a long-tail settle.
      tl.fromTo($("slot"), { x: 1150, opacity: 0 }, { x: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, 2.6);

      // ---- Scene 4 (3.8–7.4): bullets one per beat, marker first.
      [[$("b0"), 4.0], [$("b1"), 5.3], [$("b2"), 6.6]].forEach(([li, t]) => {
        const mark = li.children[0], copy = li.children[1];
        tl.fromTo(mark, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t);
        tl.fromTo(copy, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.08);
      });

      // ---- Scene 8 (11.4–11.9): magenta marker underline sweeps in under the closing bullet.
      tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 11.4);

      // ---- Scenes 5–8: camera inside the slot (coordinate-target-zoom).
      // Slot box is W x H; the clip fills it at k = W / 1920. The camera is a view rect
      // (viewLeft, viewTop, S) in box-local px, realised as transform (zoom + counter-translate,
      // origin 0 0) plus a clip-path inset that keeps the visible area exactly the slot box.
      // Applied identically to the still and the hoisted live clip, so the 7.4s handoff is seamless.
      const W = 998.4, H = 561.6, k = W / 1920;
      // Targets measured on the clip's frames (1920x1080 source px):
      //   line 4 string literal 'Vue Workshop' centre ≈ (271, 157); preview heading centre ≈ (1440, 233).
      const ZOOM = 3.0;
      const WIDE = { s: 1, cx: W / 2, cy: H / 2 };
      const LINE4 = { s: ZOOM, cx: 271 * k, cy: 157 * k };
      const HEADING = { s: ZOOM, cx: 1440 * k, cy: 233 * k };
      const KEYS = [
        { t0: 0, t1: 7.4, a: WIDE, b: WIDE, ease: "none" },
        { t0: 7.4, t1: 8.8, a: WIDE, b: LINE4, ease: "power3.inOut" },      // Scene 5 push in
        { t0: 8.8, t1: 10.6, a: LINE4, b: LINE4, ease: "none" },             // Scene 6 hold (typing is the motion)
        { t0: 10.6, t1: 11.2, a: LINE4, b: HEADING, ease: "power4.out" },    // Scene 7 pan: fast in, hard land
        { t0: 11.2, t1: 11.4, a: HEADING, b: HEADING, ease: "none" },
        { t0: 11.4, t1: 12.4, a: HEADING, b: WIDE, ease: "power3.out" },     // Scene 8 decelerating pull-back
        { t0: 12.4, t1: DUR, a: WIDE, b: WIDE, ease: "none" },               // Scene 9 held read
      ].map((seg) => ({ ...seg, fn: gsap.parseEase(seg.ease) }));
      const lerp = (a, b, p) => a + (b - a) * p;
      const camAt = (t) => {
        let seg = KEYS[KEYS.length - 1];
        for (let i = 0; i < KEYS.length; i++) if (t < KEYS[i].t1) { seg = KEYS[i]; break; }
        const p = seg.fn(Math.min(1, Math.max(0, (t - seg.t0) / (seg.t1 - seg.t0))));
        const s = lerp(seg.a.s, seg.b.s, p);
        const vw = W / s, vh = H / s;
        // Clamp so the view never leaves the captured surface (no empty edge inside the slot).
        const left = Math.min(W - vw, Math.max(0, lerp(seg.a.cx, seg.b.cx, p) - vw / 2));
        const top = Math.min(H - vh, Math.max(0, lerp(seg.a.cy, seg.b.cy, p) - vh / 2));
        return { s, left, top, vw, vh };
      };
      let live = null;
      const still = $("still");
      const applyCam = (el, c) => {
        if (!el) return;
        el.style.transformOrigin = "0 0";
        el.style.transform = `translate(${(-c.left * c.s).toFixed(3)}px, ${(-c.top * c.s).toFixed(3)}px) scale(${c.s.toFixed(5)})`;
        const r = W - (c.left + c.vw), b = H - (c.top + c.vh);
        el.style.clipPath = c.s <= 1.0001 ? "none"
          : `inset(${c.top.toFixed(3)}px ${r.toFixed(3)}px ${b.toFixed(3)}px ${c.left.toFixed(3)}px)`;
      };
      const cam = { t: 0 };
      tl.to(cam, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const c = camAt(cam.t);
          if (!live) live = window.document.getElementById("f-" + ID + "-live"); // hoisted to the host root; the frame-scoped `document` cannot see it
          applyCam(still, c);
          applyCam(live, c);
        },
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
