  <script>

      var tl = gsap.timeline({ paused: true });

      // --- discrete-text-sequence: human typing schedules (sparse states) ---

      var KICKER = [

      ];
      var SAY = [

        { t: 3.54, text: "ye" },
        { t: 3.62, text: "yeh" },
        { t: 3.72, text: "yeh-" },

        { t: 4.0, text: "yeh-yeh" },
        { t: 4.1, text: "yeh-yeh-" },
        { t: 4.22, text: "yeh-yeh-C" },
        { t: 4.3, text: "yeh-yeh-CO" },
        { t: 4.38, text: "yeh-yeh-CO-" },
        { t: 4.46, text: "yeh-yeh-CO-a" },
        { t: 4.53, text: "yeh-yeh-CO-ah" }
      ];

      // context-sensitive-cursor: which caret is active per time window.
      // title (typing + idle) -> kicker (typing) -> parked after the name -> pronunciation -> gone at 4.6s.
      var CARET_SEGMENTS = [
        { t: 0.0, seg: "title" },
        { t: 2.46, seg: "kicker" },
        { t: 3.26, seg: "title" },
        { t: 3.42, seg: "say" },
        { t: 4.6, seg: "none" }
      ];

      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return seq[i].text;
        return "";
      }
      function segAt(time) {
        for (var i = CARET_SEGMENTS.length - 1; i >= 0; i--) if (time >= CARET_SEGMENTS[i].t) return CARET_SEGMENTS[i].seg;
        return "title";
      }
      // Baked change times — caret holds solid while keys are landing (seek-safe, no mutable state).
      function changeTimes(seq) {
        var out = [];
        for (var i = 1; i < seq.length; i++) if (seq[i].text !== seq[i - 1].text) out.push(seq[i].t);
        return out;
      }
      var CHANGES = changeTimes(TITLE).concat(changeTimes(KICKER), changeTimes(SAY), [2.46, 3.26, 3.42]);
      var TYPING_GRACE = 0.16;
      var BLINK_CYCLES = 12; // 0.75s period, whole number across 9s

      var driver = { t: 0, p: 0 };
      tl.to(driver, {
        t: DURATION,
        p: Math.PI * 2 * BLINK_CYCLES,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var t = driver.t;
          titleText.textContent = textAt(TITLE, t);
          kickerText.textContent = textAt(KICKER, t);
          sayText.textContent = textAt(SAY, t);

          var typing = false;
          for (var i = 0; i < CHANGES.length; i++) {
            if (CHANGES[i] <= t && t - CHANGES[i] < TYPING_GRACE) { typing = true; break; }
          }
          var on = typing || Math.sin(driver.p) > 0;
          var seg = segAt(t);
          carets.title.style.opacity = seg === "title" && on ? "1" : "0";
          carets.kicker.style.opacity = seg === "kicker" && on ? "1" : "0";
          carets.say.style.opacity = seg === "say" && on ? "1" : "0";

      }, 0);

      // --- waterfall-entry: binary reveal + whip up from below, overlapping cascade ---
      function cascade(start, frags) {
        var t = start;
        frags.forEach(function (f) {
          var el = $(f.id);
          tl.set(el, { opacity: 1, y: f.y }, t);
          tl.to(el, { y: 0, duration: f.d, ease: "power4.out" }, t);
          t = t + f.d - f.overlap * F;
        });
      }
